id = "spatial_gui"
kind = "native-mod"
name = "Spatial GUI"
summary = "Renders inventory, creative, and container screens as a 3D plane in the world with smooth third-person camera transitions."
description = """
Spatial GUI transforms flat inventory, creative, and container screens (chests, furnaces, smokers, crafting tables, workstations) into interactive 3D planes floating in the game world.

- **Third-Person Over-the-Shoulder Mode:** Your camera smoothly swings behind and beside your player model while the menu floats in 3D world space with a subtle drop shadow, then smoothly returns when closed.
- **First-Person Mode:** Keeps your normal first-person perspective and hand visible while projecting the opened UI directly in front of you in 3D space.
- **Analytic Ray-Plane Cursor Mapping:** Mouse coordinates are unprojected onto the 3D plane every frame so slot clicks, drags, shift-clicks, and tooltips align accurately.
- **Clean World & Flat Overlays:** Clears dark screen tint and background blur behind the 3D GUI, while keeping F3 debug text and advancement/recipe toasts flat.
- **Settings & Keybind:** Full English settings with tooltips under `Options > Mods > Spatial GUI > Config`, plus `F8` toggle in `Options > Controls`.

**Multiplayer Warning:** Spatial GUI is disabled by default (`Enable Spatial GUI = false`, toggle with `F8` or in mod settings) because it remaps inventory cursor input onto the 3D plane. Multiplayer servers may disallow or flag inventory input remapping, so players should check the server's rules before turning it on. The third-person camera position override is also disabled in multiplayer and block-collision clipped in singleplayer.

This mod uses `#![deny(unsafe_code)]`, makes no network requests, and collects no telemetry. All three `[[native.mixin]]` targets are documented in the repository README.

A Horizon Rust port of [Spatial GUI](https://github.com/tastytrash/Spatial-GUI) by tastytrash (MIT License).
"""
